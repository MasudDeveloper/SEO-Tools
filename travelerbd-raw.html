\u09b0\u09a8\u09cb \u0990\u09a4\u09bf\u09b9\u09cd\u09af\u09ac\u09be\u09b9\u09c0 \u09b8\u09cd\u09a5\u09be\u09aa\u09a4\u09cd\u09af\u09c7\u09b0 \u099b\u09cb\u0981\u09df\u09be \u09b0\u09df\u09c7\u099b\u09c7 \u098f\u09b0 \u09ae\u09c2\u09b2 \u09ae\u09bf\u09ae\u09cd\u09ac\u09b0 \u0993 \u09b8\u09c0\u09ae\u09be\u09a8\u09be \u09aa\u09cd\u09b0\u09be\u099a\u09c0\u09b0\u09c7\u0964&lt;\/p&gt;&lt;p&gt;\u2705 \u09a8\u09b0\u09b8\u09c1\u09a8\u09cd\u09a6\u09be \u09a8\u09a6\u09c0: \u0988\u09a6\u0997\u09be\u09b9\u09c7\u09b0 \u09a0\u09bf\u0995 \u09aa\u09be\u09b6 \u09a6\u09bf\u09af\u09bc\u09c7\u0987 \u09ac\u09af\u09bc\u09c7 \u0997\u09c7\u099b\u09c7 \u09a8\u09b0\u09b8\u09c1\u09a8\u09cd\u09a6\u09be \u09a8\u09a6\u09c0, \u09af\u09be \u09aa\u09b0\u09cd\u09af\u099f\u0995\u09a6\u09c7\u09b0 \u09aa\u09cd\u09b0\u09b6\u09be\u09a8\u09cd\u09a4\u09bf \u09a6\u09c7\u09df\u0964&lt;\/p&gt;&lt;p&gt;\u2705 \u09a7\u09b0\u09cd\u09ae\u09c0\u09af\u09bc \u09ae\u09bf\u09b2\u09a8\u09ae\u09c7\u09b2\u09be: \u0988\u09a6\u09c7\u09b0 \u09a6\u09bf\u09a8\u0997\u09c1\u09b2\u09cb\u09a4\u09c7 \u098f\u0996\u09be\u09a8\u09c7 \u09b6\u09c1\u09a7\u09c1 \u09a8\u09be\u09ae\u09be\u099c\u0987 \u09a8\u09df, \u09ac\u09b0\u0982 \u09ac\u09bf\u09b6\u09be\u09b2 \u0997\u09cd\u09b0\u09be\u09ae\u09cd\u09af \u09ae\u09c7\u09b2\u09be \u09ac\u09b8\u09c7 \u09af\u09be \u0997\u09cd\u09b0\u09be\u09ae \u09ac\u09be\u0982\u09b2\u09be\u09b0 \u09b8\u0982\u09b8\u09cd\u0995\u09c3\u09a4\u09bf \u09ab\u09c1\u099f\u09bf\u09df\u09c7 \u09a4\u09cb\u09b2\u09c7\u0964&lt;\/p&gt;&lt;h3&gt;\u23f0 \u09b6\u09cb\u09b2\u09be\u0995\u09bf\u09af\u09bc\u09be \u0988\u09a6\u0997\u09be\u09b9 \u09ad\u09cd\u09b0\u09ae\u09a3\u09c7\u09b0 \u09b8\u09c7\u09b0\u09be \u09b8\u09ae\u09af\u09bc&lt;\/h3&gt;&lt;p&gt;\u09b6\u09cb\u09b2\u09be\u0995\u09bf\u09af\u09bc\u09be \u0988\u09a6\u0997\u09be\u09b9 \u09ad\u09cd\u09b0\u09ae\u09a3\u09c7\u09b0 \u09b8\u09ac\u099a\u09c7\u09af\u09bc\u09c7 \u0986\u09a6\u09b0\u09cd\u09b6 \u09b8\u09ae\u09af\u09bc \u09b9\u09b2\u09cb \u0988\u09a6\u09c1\u09b2 \u09ab\u09 9be\u09ae\u09a8\u09c7\u0987 \u09ad\u09be\u09b0\u09a4\u09c7\u09b0 \u09ae\u09c7\u0998\u09be\u09b2\u09df \u09aa\u09be\u09b9\u09be\u09dc \u098f\u09ac\u0982 \u09b8\u09c7\u0996\u09be\u09a8 \u09a5\u09c7\u0995\u09c7 \u09a8\u09c7\u09ae\u09c7 \u0986\u09b8\u09be \u09ac\u09bf\u09b6\u09be\u09b2 \u099d\u09b0\u09a8\u09be \u09a6\u09c7\u0996\u09be \u09af\u09be\u09df\u0964 \u09ac\u09b0\u09cd\u09b7\u09be\u0995\u09be\u09b2\u09c7 \u098f\u0987 \u099d\u09b0\u09a8\u09be\u0997\u09c1\u09b2\u09cb \u09aa\u09c2\u09b0\u09cd\u09a3\u09b0\u09c2\u09aa\u09c7 \u09a6\u09c7\u0996\u09be \u09a6\u09c7\u09df\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09b8\u09cd\u09ac\u099a\u09cd\u099b \u0993 \u09a0\u09be\u09a8\u09cd\u09a1\u09be \u09aa\u09be\u09a8\u09bf&lt;\/strong&gt;: \u09aa\u09be\u09b9\u09be\u09dc \u09a5\u09c7\u0995\u09c7 \u0986\u09b8\u09be \u09aa\u09be\u09a8\u09bf \u0985\u09a4\u09cd\u09af\u09a8\u09cd\u09a4 \u09b8\u09cd\u09ac\u099a\u09cd\u099b \u098f\u09ac\u0982 \u09ac\u09b0\u09ab\u09c7\u09b0 \u09ae\u09a4\u09cb \u09a0\u09be\u09a8\u09cd\u09a1\u09be \u09a5\u09be\u0995\u09c7, \u09af\u09be \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4\u09bf \u09a6\u09c2\u09b0 \u0995\u09b0\u09a4\u09c7 \u09a6\u09be\u09b0\u09c1\u09a3\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09a8\u09cc\u0995\u09be \u09ad\u09cd\u09b0\u09ae\u09a3&lt;\/strong&gt;: \u09b9\u09be\u09a6\u09be\u09b0\u09aa\u09be\u09dc \u09ac\u09be\u099c\u09be\u09b0 \u09a5\u09c7\u0995\u09c7 \u09ac\u09bf\u099b\u09a8\u09be\u0995\u09be\u09a8\u09cd\u09a6\u09bf \u09af\u09be\u0993\u09df\u09be\u09b0 \u09aa\u09a5\u099f\u09bf \u0985\u09a4\u09cd\u09af\u09a8\u09cd\u09a4 \u09b8\u09c1\u09a8\u09cd\u09a6\u09b0\u0964 \u09a8\u09a6\u09c0\u09b0 \u09a6\u09c1\u0987 \u09aa\u09be\u09b6\u09c7\u09b0 \u0997\u09cd\u09b0\u09be\u09ae \u0993 \u09aa\u09be\u09b9\u09be\u09dc\u09c7\u09b0 \u09a6\u09c3\u09b6\u09cd\u09af \u0986\u09aa\u09a8\u09be\u0995\u09c7 \u09ae\u09c1\u0997\u09cd\u09a7 \u0995\u09b0\u09ac\u09c7\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;\u23f0 \u09ad\u09cd\u09b0\u09ae\u09a3\u09c7\u09b0 \u09b8\u09c7\u09b0\u09be \u09b8\u09ae\u09df&lt;\/strong&gt;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09ac\u09b0\u09cd\u09b7\u09be\u0995\u09be\u09b2 \u0993 \u09b6\u09b0\u09ce\u0995\u09be\u09b2 (\u099c\u09c1\u09a8 \u2013 \u0985\u0995\u09cd\u099f\u09cb\u09ac\u09b0)&lt;\/strong&gt;: \u09ac\u09bf\u099b\u09a8\u09be\u0995\u09be\u09a8\u09cd\u09a6\u09bf\u09b0 \u0986\u09b8\u09b2 \u09b0\u09c2\u09aa \u09a6\u09c7\u0996\u09be\u09b0 \u09b8\u09c7\u09b0\u09be \u09b8\u09ae\u09df \u098f\u099f\u09bf\u0964 \u09a4\u0996\u09a8 \u099d\u09b0\u09a8\u09be\u0997\u09c1\u09b2\u09cb\u09a4\u09c7 \u09aa\u09cd\u09b0\u099a\u09c1\u09b0 \u09aa\u09be\u09a8\u09bf \u09a5\u09be\u0995\u09c7 \u098f\u09ac\u0982 \u09aa\u09be\u09b9\u09be\u09dc\u0997\u09c1\u09b2\u09cb \u09ae\u09c7\u0998\u09c7 \u09a2\u09be\u0995\u09be \u09a5\u09be\u0995\u09c7\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09b6\u09c0\u09a4\u0995\u09be\u09b2 (\u09a8\u09ad\u09c7\u09ae\u09cd\u09ac\u09b0 \u2013 \u09ab\u09c7\u09ac\u09cd\u09b0\u09c1\u09df\u09be\u09b0\u09bf)&lt;\/strong&gt;: \u09aa\u09be\u09a8\u09bf \u0985\u09a8\u09c7\u0995 \u0995\u09ae\u09c7 \u09af\u09be\u09df \u098f\u09ac\u0982 \u09aa\u09be\u09a5\u09b0\u0997\u09c1\u09b2\u09cb \u099c\u09c7\u0997\u09c7 \u0993\u09a0\u09c7\u0964 \u09a8\u09cc\u0995\u09be \u099a\u09b2\u09be\u099a\u09b2 \u09ac\u09cd\u09af\u09be\u09b9\u09a4 \u09b9\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7, \u09a4\u09ac\u09c7 \u09aa\u09be\u09a8\u09bf\u09b0 \u09b8\u09cd\u09ac\u099a\u09cd\u099b\u09a4\u09be \u0985\u09a8\u09c7\u0995 \u09ac\u09c7\u09b6\u09bf \u09a5\u09be\u0995\u09c7\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;p&gt;&lt;strong&gt;\ud83d\udcb0 \u0996\u09b0\u099a \u0993 \u09ab\u09bf&lt;\/strong&gt;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09a8\u09cc\u0995\u09be \u09ad\u09be\u09dc\u09be&lt;\/strong&gt;: \u09b9\u09be\u09a6\u09be\u09b0\u09aa\u09be\u09dc \u0998\u09be\u099f \u09a5\u09c7\u0995\u09c7 \u09ac\u09bf\u099b\u09a8\u09be\u0995\u09be\u09a8\u09cd\u09a6\u09bf \u09af\u09be\u0993\u09df\u09be-\u0986\u09b8\u09be\u09b0 \u099c\u09a8\u09cd\u09af \u09a8\u09cc\u0995\u09be \u09b0\u09bf\u099c\u09be\u09b0\u09cd\u09ad \u0995\u09b0\u09a4\u09c7 \u09b9\u09df\u0964 \u09ad\u09be\u09dc\u09be \u09b8\u09be\u09a7\u09be\u09b0\u09a3\u09a4 \u09e7,\u09e8\u09e6\u09e6 \u09a5\u09c7\u0995\u09c7 \u09e8,\u09e6\u09e6\u09e6 \u099f\u09be\u0995\u09be\u09b0 \u09ae\u09a7\u09cd\u09af\u09c7 (\u09e7\u09e6-\u09e7\u09e8 \u099c\u09a8 \u09ac\u09b8\u09be \u09af\u09be\u09df)\u0964 \u09b8\u09bf\u099c\u09a8 \u09ad\u09c7\u09a6\u09c7 \u09ad\u09be\u09dc\u09be \u0995\u09ae-\u09ac\u09c7\u09b6\u09bf \u09b9\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09aa\u09cd\u09b0\u09ac\u09c7\u09b6 \u09ab\u09bf&lt;\/strong&gt;: \u09b8\u09be\u09a7\u09be\u09b0\u09a3\u09a4 \u0995\u09cb\u09a8\u09cb \u09aa\u09cd\u09b0\u09ac\u09c7\u09b6 \u09ab\u09bf \u09a8\u09c7\u0987, \u09a4\u09ac\u09c7 \u09b8\u09cd\u09a5\u09be\u09a8\u09c0\u09df \u09ac\u09cd\u09af\u09ac\u09b8\u09cd\u09a5\u09be\u09aa\u09a8\u09be \u0995\u09ae\u09bf\u099f\u09bf \u09ae\u09be\u099d\u09c7\u09ae\u09a7\u09cd\u09af\u09c7 \u09b8\u09be\u09ae\u09be\u09a8\u09cd\u09af \u09ab\u09bf \u09a8\u09bf\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;\ud83d\udccd \u09af\u09be\u09a4\u09be\u09df\u09be\u09a4 \u09ac\u09cd\u09af\u09ac\u09b8\u09cd\u09a5\u09be&lt;\/strong&gt;&lt;\/p&gt;&lt;p&gt;\u09b8\u09bf\u09b2\u09c7\u099f \u09b6\u09b9\u09b0 \u09a5\u09c7\u0995\u09c7 \u09ac\u09bf\u099b\u09a8\u09be\u0995\u09be\u09a8\u09cd\u09a6\u09bf\u09b0 \u09a6\u09c2\u09b0\u09a4\u09cd\u09ac \u09aa\u09cd\u09b0\u09be\u09df \u09ea\u09e6 \u0995\u09bf\u09b2\u09cb\u09ae\u09bf\u099f\u09be\u09b0\u0964&lt;\/p&gt;&lt;p&gt;\u09e7. &lt;strong&gt;\u09b8\u09bf\u09b2\u09c7\u099f \u09a5\u09c7\u0995\u09c7 \u09b9\u09be\u09a6\u09be\u09b0\u09aa\u09be\u09dc&lt;\/strong&gt;: \u09b8\u09bf\u09b2\u09c7\u099f \u09b6\u09b9\u09b0\u09c7\u09b0 \u0986\u09ae\u09cd\u09ac\u09b0\u0996\u09be\u09a8\u09be \u09aa\u09df\u09c7\u09a8\u09cd\u099f \u09a5\u09c7\u0995\u09c7 \u09b8\u09bf\u098f\u09a8\u099c\u09bf \u09ac\u09be \u09b2\u09c7\u0997\u09c1\u09a8\u09be\u09df \u0995\u09b0\u09c7 \u09b9\u09be\u09a6\u09be\u09b0\u09aa\u09be\u09dc \u0998\u09be\u099f\u09c7 \u09af\u09c7\u09a4\u09c7 \u09b9\u09ac\u09c7 (\u09ad\u09be\u09dc\u09be \u099c\u09a8\u09aa\u09cd\u09b0\u09a4\u09bf \u09e7\u09eb\u09e6-\u09e8\u09e6\u09e6 \u099f\u09be\u0995\u09be)\u0964&lt;br&gt;\u09e8. &lt;strong&gt;\u09b9\u09be\u09a6\u09be\u09b0\u09aa\u09be\u09dc \u09a5\u09c7\u0995\u09c7 \u09a8\u09cc\u0995\u09be&lt;\/strong&gt;: \u09b9\u09be\u09a6\u09be\u09b0\u09aa\u09be\u09dc \u09ac\u09be\u099c\u09be\u09b0 \u0998\u09be\u099f \u09a5\u09c7\u0995\u09c7 \u09a8\u09cc\u0995\u09be\u09df \u0995\u09b0\u09c7 \u09e8\u09e6-\u09e9\u09e6 \u09ae\u09bf\u09a8\u09bf\u099f\u09c7 \u09ac\u09bf\u099b\u09a8\u09be\u0995\u09be\u09a8\u09cd\u09a6\u09bf \u09aa\u09cc\u0981\u099b\u09be\u09a8\u09cb \u09af\u09be\u09df\u0964&lt;br&gt;\u09e9. &lt;strong&gt;\u09aa\u09cd\u09b0\u09be\u0987\u09ad\u09c7\u099f \u0995\u09be\u09b0&lt;\/strong&gt;: \u09b8\u09b0\u09be\u09b8\u09b0\u09bf \u0997\u09be\u09dc\u09bf \u09b0\u09bf\u099c\u09be\u09b0\u09cd\u09ad \u0995\u09b0\u09c7 \u0997\u09c7\u09b2\u09c7 \u09e8,\u09eb\u09e6\u09e6-\u09e9,\u09eb\u09e6\u09e6 \u099f\u09be\u0995\u09be\u09b0 \u09ae\u09a4\u09cb \u09b2\u09be\u0997\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7\u0964&lt;\/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;\ud83d\udca1 \u0995\u09bf\u099b\u09c1 \u099c\u09b0\u09c1\u09b0\u09bf \u099f\u09bf\u09aa\u09b8&lt;\/strong&gt;&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09aa\u09be\u09a5\u09b0 \u09a5\u09c7\u0995\u09c7 \u09b8\u09be\u09ac\u09a7\u09be\u09a8&lt;\/strong&gt;: \u09aa\u09be\u09a8\u09bf\u09b0 \u09a8\u09bf\u099a\u09c7\u09b0 \u09aa\u09be\u09a5\u09b0\u0997\u09c1\u09b2\u09cb \u0996\u09c1\u09ac \u09aa\u09bf\u099a\u09cd\u099b\u09bf\u09b2 \u09a5\u09be\u0995\u09c7, \u09a4\u09be\u0987 \u09b9\u09be\u0981\u099f\u09be\u09b0 \u09b8\u09ae 9bc\u09c7\u09b0 \u099a\u09c2\u09a1\u09bc\u09be\u09af\u09bc \u098f\u0987 \u09b2\u09c7\u0995\u099f\u09bf\u09b0 \u0985\u09ac\u09b8\u09cd\u09a5\u09be\u09a8\u0964 \u098f\u0995\u09c7 \u09ac\u09b2\u09be \u09b9\u09af\u09bc &lt;strong&gt;&amp;quot;\u0995\u09c7\u0993\u0995\u09cd\u09b0\u09be\u09a1\u0982\u09af\u09bc\u09c7\u09b0 \u09aa\u09cd\u09b0\u09ac\u09c7\u09b6\u09a6\u09cd\u09ac\u09be\u09b0&amp;quot;&lt;\/strong&gt;\u0964 \u0986\u0997\u09cd\u09a8\u09c7\u09af\u09bc\u0997\u09bf\u09b0\u09bf\u09b0 \u099c\u09cd\u09ac\u09be\u09b2\u09be\u09ae\u09c1\u0996 \u09ac\u09be \u09ae\u09b9\u09be\u0995\u09be\u09b6 \u09a5\u09c7\u0995\u09c7 \u0989\u09b2\u09cd\u0995\u09be\u09aa\u09bf\u09a8\u09cd\u09a1\u09c7\u09b0 \u09aa\u09a4\u09a8\u09c7\u09b0 \u09ab\u09b2\u09c7 \u098f\u099f\u09bf \u09b8\u09c3\u09b7\u09cd\u099f\u09bf \u09b9\u09af\u09bc\u09c7\u099b\u09c7 \u09ac\u09b2\u09c7 \u09a7\u09be\u09b0\u09a3\u09be \u0995\u09b0\u09be \u09b9\u09af\u09bc\u0964 [1]&lt;\/p&gt;&lt;hr&gt;&lt;h2&gt;&lt;strong&gt;\ud83d\udc8e \u09aa\u09cd\u09b0\u09a7\u09be\u09a8 \u0986\u0995\u09b0\u09cd\u09b7\u09a3 \u0993 \u09ac\u09c8\u09b6\u09bf\u09b7\u09cd\u099f\u09cd\u09af&lt;\/strong&gt;&lt;\/h2&gt;&lt;p&gt;\u09ac\u0997\u09be \u09b2\u09c7\u0995\u09c7\u09b0 \u09a8\u09c0\u09b2 \u09aa\u09be\u09a8\u09bf \u098f\u09ac\u0982 \u099a\u09be\u09b0\u09aa\u09be\u09b6\u09c7\u09b0 \u09a8\u09bf\u09b8\u09cd\u09a4\u09ac\u09cd\u09a7\u09a4\u09be \u09aa\u09b0\u09cd\u09af\u099f\u0995\u09a6\u09c7\u09b0 \u098f\u0995 \u0985\u09a8\u09cd\u09af \u099c\u0997\u09a4\u09c7 \u09a8\u09bf\u09df\u09c7 \u09af\u09be\u09df:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09b8\u09cd\u09ac\u099a\u09cd\u099b \u09a8\u09c0\u09b2 \u099c\u09b2&lt;\/strong&gt;: \u098f\u0987 \u09b2\u09c7\u0995\u09c7\u09b0 \u09aa\u09be\u09a8\u09bf \u0985\u09a8\u09c7\u0995 \u0997\u09ad\u09c0\u09b0 \u098f\u09ac\u0982 \u09a8\u09c0\u09b2 \u09b0\u0999\u09c7\u09b0\u0964 \u09b2\u09c7\u0995\u09c7\u09b0 \u099a\u09be\u09b0\u09aa\u09be\u09b6 \u0989\u0981\u099a\u09c1 \u09aa\u09be\u09b9\u09be\u09a1\u09bc \u09a6\u09bf\u09af\u09bc\u09c7 \u0998\u09c7\u09b0\u09be, \u09af\u09be \u09aa\u09be\u09a8\u09bf\u09b0 \u0993\u09aa\u09b0 \u099a\u09ae\u09ce\u0995\u09be\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u099a\u09cd\u099b\u09ac\u09bf \u09a4\u09c8\u09b0\u09bf \u0995\u09b0\u09c7\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09b0\u09b9\u09b8\u09cd\u09af\u09ae\u09df \u09aa\u09cd\u09b0\u0995\u09c3\u09a4\u09bf&lt;\/strong&gt;: \u09b2\u09c7\u0995\u09c7\u09b0 \u09aa\u09be\u09a8\u09bf\u09b0 \u09b0\u0999 \u09ae\u09be\u099d\u09c7\u09ae\u09a7\u09cd\u09af\u09c7 \u09aa\u09b0\u09bf\u09ac\u09b0\u09cd\u09a4\u09a8 \u09b9\u09df \u09ac\u09b2\u09c7 \u09b2\u09cb\u0995\u09ae\u09c1\u0996\u09c7 \u09aa\u09cd\u09b0\u099a\u09b2\u09bf\u09a4 \u0986\u099b\u09c7, \u09af\u09be \u09aa\u09b0\u09cd\u09af\u099f\u0995\u09a6\u09c7\u09b0 \u0995\u09be\u099b\u09c7 \u098f\u0995\u099f\u09bf \u09ac\u09dc \u09b0\u09b9\u09b8\u09cd\u09af\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09ac\u09ae \u09aa\u09be\u09a1\u09bc\u09be&lt;\/strong&gt;: \u09b2\u09c7\u0995\u09c7\u09b0 \u09aa\u09be\u09a1\u09bc\u09c7\u0987 \u09ac\u09ae \u0986\u09a6\u09bf\u09ac\u09be\u09b8\u09c0\u09a6\u09c7\u09b0 \u098f\u0995\u099f\u09bf \u0997\u09cd\u09b0\u09be\u09ae \u09b0\u09af\u09bc\u09c7\u099b\u09c7\u0964 \u09a4\u09be\u09a6\u09c7\u09b0 \u09ae\u09be\u099a\u09be \u0995\u09b0\u09be \u0998\u09b0 \u098f\u09ac\u0982 \u09b8\u09b0\u09b2 \u099c\u09c0\u09ac\u09a8\u09af\u09be\u09a4\u09cd\u09b0\u09be \u0996\u09c1\u09ac \u0995\u09be\u099b \u09a5\u09c7\u0995\u09c7 \u09a6\u09c7\u0996\u09be \u09af\u09be\u09df\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09b0\u09be\u09a4\u09cd\u09b0\u09bf\u09af\u09be\u09aa\u09a8&lt;\/strong&gt;: \u09b2\u09c7\u0995\u09c7\u09b0 \u09aa\u09be\u09dc\u09c7 \u0995\u09be\u09a0\u09c7\u09b0 \u0995\u099f\u09c7\u099c\u09c7 \u09b0\u09be\u09a4 \u0995\u09be\u099f\u09be\u09a8\u09cb \u098f\u09ac\u0982 \u09b0\u09be\u09a4\u09c7 \u09a4\u09be\u09b0\u09be\u09b0 \u09ae\u09c7\u09b2\u09be \u09a6\u09c7\u0996\u09be \u098f\u0995 \u0985\u09ac\u09bf\u09b8\u09cd\u09ae\u09b0\u09a3\u09c0\u09af\u09bc \u0985\u09ad\u09bf\u099c\u09cd\u099e\u09a4\u09be\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u0995\u09c7\u0993\u0995\u09cd\u09b0\u09be\u09a1\u0982 \u099f\u09cd\u09b0\u09c7\u0995\u09bf\u0982&lt;\/strong&gt;: \u09af\u09be\u09b0\u09be \u0995\u09c7\u0993\u0995\u09cd\u09b0\u09be\u09a1\u0982 \u09aa\u09be\u09b9\u09be\u09dc \u099c\u09df \u0995\u09b0\u09a4\u09c7 \u099a\u09be\u09a8, \u09a4\u09be\u09a6\u09c7\u09b0 \u09ac\u0997\u09be \u09b2\u09c7\u0995\u09c7\u0987 \u09b0\u09be\u09a4 \u0995\u09be\u099f\u09bf\u09df\u09c7 \u09aa\u09b0\u09a6\u09bf\u09a8 \u09b8\u0995\u09be\u09b2\u09c7 \u099f\u09cd\u09b0\u09c7\u0995\u09bf\u0982 \u09b6\u09c1\u09b0\u09c1 \u0995\u09b0\u09a4\u09c7 \u09b9\u09df\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h2&gt;&lt;strong&gt;\u23f0 \u09ad\u09cd\u09b0\u09ae\u09a3\u09c7\u09b0 \u09b8\u09c7\u09b0\u09be \u09b8\u09ae\u09df&lt;\/strong&gt;&lt;\/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09b6\u09c0\u09a4\u0995\u09be\u09b2 (\u09a8\u09ad\u09c7\u09ae\u09cd\u09ac\u09b0 \u2013 \u09ab\u09c7\u09ac\u09cd\u09b0\u09c1\u09df\u09be\u09b0\u09bf)&lt;\/strong&gt;: \u098f\u099f\u09bf\u0987 \u09ac\u0997\u09be \u09b2\u09c7\u0995 \u09ad\u09cd\u09b0\u09ae\u09a3\u09c7\u09b0 &lt;strong&gt;\u09b8\u09ac\u099a\u09c7\u09af\u09bc\u09c7 \u0989\u09aa\u09af\u09c1\u0995\u09cd\u09a4 \u09b8\u09ae\u09df&lt;\/strong&gt;\u0964 \u0986\u0995\u09be\u09b6 \u09aa\u09b0\u09bf\u09b7\u09cd\u0995\u09be\u09b0 \u09a5\u09be\u0995\u09c7 \u098f\u09ac\u0982 \u099f\u09cd\u09b0\u09c7\u0995\u09bf\u0982 \u0995\u09b0\u09a4\u09c7 \u09b8\u09c1\u09ac\u09bf\u09a7\u09be \u09b9\u09df\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09ac\u09b0\u09cd\u09b7\u09be\u0995\u09be\u09b2&lt;\/strong&gt;: \u098f \u09b8\u09ae\u09df \u09aa\u09be\u09b9\u09be\u09dc\u09bf \u09b0\u09be\u09b8\u09cd\u09a4\u09be \u0996\u09c1\u09ac \u09ac\u09bf\u09aa\u099c\u09cd\u099c\u09a8\u0995 \u098f\u09ac\u0982 \u09aa\u09bf\u099a\u09cd\u099b\u09bf\u09b2 \u09a5\u09be\u0995\u09c7\u0964 \u0985\u09a8\u09c7\u0995 \u09b8\u09ae\u09df \u09aa\u09cd\u09b0\u09b6\u09be\u09b8\u09a8 \u09aa\u09b0\u09cd\u09af\u099f\u0995\u09a6\u09c7\u09b0 \u098f\u0987 \u09b0\u09c1\u099f\u09c7 \u09af\u09be\u0993\u09df\u09be\u09b0 \u0985\u09a8\u09c1\u09ae\u09a4\u09bf \u09a6\u09c7\u09df \u09a8\u09be\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;h2&gt;&lt;strong&gt;\ud83d\udcb0 \u0996\u09b0\u099a \u0993 \u0997\u09be\u0987\u09a1 \u09a4\u09a5\u09cd\u09af (\u09e8\u09e6\u09e8\u09ec \u09b8\u09ae\u09cd\u09ad\u09be\u09ac\u09cd\u09af)&lt;\/strong&gt;&lt;\/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u0997\u09be\u0987\u09a1 \u09ab\u09bf&lt;\/strong&gt;: \u09b0\u09c1\u09ae\u09be \u09ac\u09be\u099c\u09be\u09b0 \u09a5\u09c7\u0995\u09c7 \u09ac\u0997\u09be \u09b2\u09c7\u0995 \u09ac\u09be \u0995\u09c7\u0993\u0995\u09cd\u09b0\u09be\u09a1\u0982 \u09af\u09be\u0993\u09df\u09be\u09b0 \u099c\u09a8\u09cd\u09af \u0997\u09be\u0987\u09a1 \u09a8\u09c7\u0993\u09df\u09be &lt;strong&gt;\u09ac\u09be\u09a7\u09cd\u09af\u09a4\u09be\u09ae\u09c2\u09b2\u0995&lt;\/strong&gt;\u0964 \u0997\u09be\u0987\u09a1 \u09ab\u09bf \u09aa\u09cd\u09b0\u09a4\u09bf\u09a6\u09bf\u09a8 \u09eb\u09e6\u09e6-\u09ee\u09e6\u09e6 \u099f\u09be\u0995\u09be\u09b0 \u09ae\u09a4\u09cb\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09a5\u09be\u0995\u09be \u0993 \u0996\u09be\u0993\u09df\u09be&lt;\/strong&gt;: \u09ac\u09ae \u09aa\u09be\u09dc\u09be\u09b0 \u0995\u099f\u09c7\u099c\u09c7 \u09b0\u09be\u09a4 \u09aa\u09cd\u09b0\u09a4\u09bf \u09e8\u09e6\u09e6-\u09eb\u09e6\u09e6 \u099f\u09be\u0995\u09be\u09df \u09a5\u09be\u0995\u09be \u09af\u09be\u09df\u0964 \u09aa\u09be\u09b9\u09be\u09dc\u09bf \u099c\u09c1\u09ae\u09c7\u09b0 \u099a\u09be\u09b2\u09c7\u09b0 \u09ad\u09be\u09a4 \u098f\u09ac\u0982 \u09ae\u09c1\u09b0\u0997\u09bf\u09b0 \u09ae\u09be\u0982\u09b8\u09c7\u09b0 \u0996\u09be\u09ac\u09be\u09b0 \u0996\u09b0\u099a \u099c\u09a8\u09aa\u09cd\u09b0\u09a4\u09bf \u09e7\u09eb\u09e6-\u09e8\u09eb\u09e6 \u099f\u09be\u0995\u09be\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u099a\u09be\u0981\u09a6\u09c7\u09b0 \u0997\u09be\u09dc\u09bf (\u099c\u09bf\u09aa)&lt;\/strong&gt;: \u09b0\u09c1\u09ae\u09be \u09ac\u09be\u099c\u09be\u09b0 \u09a5\u09c7\u0995\u09c7 \u09ac\u0997\u09be \u09b2\u09c7\u0995 \u09aa\u09b0\u09cd\u09af\u09a8\u09cd\u09a4 \u099c\u09bf\u09aa \u09ad\u09be\u09dc\u09be \u09b8\u09be\u09a7\u09be\u09b0\u09a3\u09a4 \u09e8,\u09eb\u09e6\u09e6-\u09ea,\u09e6\u09e6\u09e6 \u099f\u09be\u0995\u09be (\u09e7\u09e8-\u09e7\u09e9 \u099c\u09a8)\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;hr&gt;&lt;h2&gt;&lt;strong&gt;\ud83d\udccd \u0995\u09c0\u09ad\u09be\u09ac\u09c7 \u09af\u09be\u09ac\u09c7\u09a8&lt;\/strong&gt;&lt;\/h2&gt;&lt;p&gt;\u09ac\u0997\u09be \u09b2\u09c7\u0995 \u09af\u09be\u0993\u09df\u09be \u09ac\u09c7\u09b6 \u09a6\u09c0\u09b0\u09cd\u0998 \u098f\u09ac\u0982 \u09b0\u09cb\u09ae\u09be\u099e\u09cd\u099a\u0995\u09b0 \u098f\u0995\u099f\u09bf \u09af\u09be\u09a4\u09cd\u09b0\u09be:&lt;\/p&gt;&lt;p&gt;\u09e7. &lt;strong&gt;\u09ac\u09be\u09a8\u09cd\u09a6\u09b0\u09ac\u09be\u09a8 \u09a5\u09c7\u0995\u09c7 \u09b0\u09c1\u09ae\u09be&lt;\/strong&gt;: \u09aa\u09cd\u09b0\u09a5\u09ae\u09c7 \u09ac\u09be\u09a8\u09cd\u09a6\u09b0\u09ac\u09be\u09a8 \u09b6\u09b9\u09b0 \u09a5\u09c7\u0995\u09c7 \u09ac\u09be\u09b8 \u09ac\u09be \u099a\u09be\u0981\u09a6\u09c7\u09b0 \u0997\u09be\u09dc\u09bf\u09a4\u09c7 \u0995\u09b0\u09c7 \u09b0\u09c1\u09ae\u09be \u09ac\u09be\u099c\u09be\u09b0\u09c7 \u09af\u09c7\u09a4\u09c7 \u09b9\u09ac\u09c7 (\u09b8\u09ae\u09df \u09b2\u09be\u0997\u09c7 \u09e8-\u09e9 \u0998\u09a3\u09cd\u099f\u09be)\u0964&lt;br&gt;\u09e8. &lt;strong&gt;\u0985\u09a8\u09c1\u09ae\u09a4\u09bf \u0997\u09cd\u09b0\u09b9\u09a3&lt;\/strong&gt;: \u09b0\u09c1\u09ae\u09be \u09ac\u09be\u099c\u09be\u09b0\u09c7 \u09aa\u09cc\u0981\u099b\u09c7 \u0986\u09b0\u09cd\u09ae\u09bf \u0995\u09cd\u09af\u09be\u09ae\u09cd\u09aa \u09a5\u09c7\u0995\u09c7 \u09ad\u09cd\u09b0\u09ae\u09a3\u09c7\u09b0 \u0985\u09a8\u09c1\u09ae\u09a4\u09bf \u09a8\u09bf\u09a4\u09c7 \u09b9\u09ac\u09c7 (NID \u0995\u09be\u09b0\u09cd\u09a1\u09c7\u09b0 \u09ab\u099f\u09cb\u0995\u09aa\u09bf \u09aa\u09cd\u09b0\u09df\u09cb\u099c\u09a8)\u0964&lt;br&gt;\u09e9. &lt;strong&gt;\u09b0\u09c1\u09ae\u09be \u09a5\u09c7\u0995\u09c7 \u09ac\u0997\u09be \u09b2\u09c7\u0995&lt;\/strong&gt;: \u09b0\u09c1\u09ae\u09be \u09a5\u09c7\u0995\u09c7 \u099a\u09be\u0981\u09a6\u09c7\u09b0 \u0997\u09be\u09dc\u09bf\u09a4\u09c7 \u0995\u09b0\u09c7 \u09ac\u0997\u09be \u09b2\u09c7\u0995\u09c7\u09b0 \u0989\u09a6\u09cd\u09a6\u09c7\u09b6\u09cd\u09af\u09c7 \u09b0\u0993\u09df\u09be\u09a8\u09be \u09a6\u09bf\u09a4\u09c7 \u09b9\u09ac\u09c7\u0964 \u09b0\u09be\u09b8\u09cd\u09a4\u09be \u0985\u09a4\u09cd\u09af\u09a8\u09cd\u09a4 \u0996\u09be\u09dc\u09be \u098f\u09ac\u0982 \u0986\u0981\u0995\u09be\u09ac\u09be\u0981\u0995\u09be\u0964&lt;\/p&gt;&lt;hr&gt;&lt;h2&gt;&lt;strong&gt;\ud83d\udca1 \u0995\u09bf\u099b\u09c1 \u099c\u09b0\u09c1\u09b0\u09bf \u099f\u09bf\u09aa\u09b8&lt;\/strong&gt;&lt;\/h2&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;NID \u0995\u09be\u09b0\u09cd\u09a1&lt;\/strong&gt;: \u09a8\u09bf\u09b0\u09be\u09aa\u09a4\u09cd\u09a4\u09be \u09a8\u09bf\u09b6\u09cd\u099a\u09bf\u09a4 \u0995\u09b0\u09a4\u09c7 \u098f\u09a8\u0986\u0987\u09a1\u09bf \u0995\u09be\u09b0\u09cd\u09a1\u09c7\u09b0 \u09eb-\u09ec\u099f\u09bf \u09ab\u099f\u09cb\u0995\u09aa\u09bf \u09b8\u09be\u09a5\u09c7 \u09b0\u09be\u0996\u09c1\u09a8\u0964 \u09ac\u09bf\u09a6\u09c7\u09b6\u09bf \u09aa\u09b0\u09cd\u09af\u099f\u0995\u09a6\u09c7\u09b0 \u0995\u09cd\u09b7\u09c7\u09a4\u09cd\u09b0\u09c7 \u09ac\u09bf\u09b6\u09c7\u09b7 \u0985\u09a8\u09c1\u09ae\u09a4\u09bf\u09b0 \u09aa\u09cd\u09b0\u09df\u09cb\u099c\u09a8 \u09b9\u09df\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09a8\u09c7\u099f\u0993\u09df\u09be\u09b0\u09cd\u0995&lt;\/strong&gt;: \u098f\u0996\u09be\u09a8\u09c7 &lt;strong&gt;\u099f\u09c7\u09b2\u09bf\u099f\u0995&lt;\/strong&gt; \u098f\u09ac\u0982 &lt;strong&gt;\u09b0\u09ac\u09bf&lt;\/strong&gt; \u09a8\u09c7\u099f\u0993\u09df\u09be\u09b0\u09cd\u0995 \u09ae\u09cb\u099f\u09be\u09ae\u09c1\u099f\u09bf \u0995\u09be\u099c \u0995\u09b0\u09c7, \u0985\u09a8\u09cd\u09af \u0985\u09aa\u09be\u09b0\u09c7\u099f\u09b0 \u0996\u09c1\u09ac \u098f\u0995\u099f\u09be \u09aa\u09be\u0993\u09df\u09be \u09af\u09be\u09df \u09a8\u09be\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09aa\u09be\u0993\u09df\u09be\u09b0 \u09ac\u09cd\u09af\u09be\u0982\u0995&lt;\/strong&gt;: \u09ac\u0997\u09be \u09b2\u09c7\u0995\u09c7 \u09ac\u09bf\u09a6\u09cd\u09af\u09c1\u09ce \u09ac\u09cd\u09af\u09ac\u09b8\u09cd\u09a5\u09be \u09b8\u09cb\u09b2\u09be\u09b0 \u09a8\u09bf\u09b0\u09cd\u09ad\u09b0, \u09a4\u09be\u0987 \u09a8\u09bf\u099c\u09c7\u09b0 \u09b8\u09be\u09a5\u09c7 \u09aa\u09be\u0993\u09df\u09be\u09b0 \u09ac\u09cd\u09af\u09be\u0982\u0995 \u09b0\u09be\u0996\u09be \u099c\u09b0\u09c1\u09b0\u09bf\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09b8\u09be\u09ac\u09a7\u09be\u09a8\u09a4\u09be&lt;\/strong&gt;: \u09b2\u09c7\u0995\u09c7\u09b0 \u09aa\u09be\u09a8\u09bf \u0985\u09a8\u09c7\u0995 \u0997\u09ad\u09c0\u09b0 \u098f\u09ac\u0982 \u09a8\u09bf\u099a\u09c7 \u099a\u09cb\u09b0\u09be\u09ac\u09be\u09b2\u09bf \u09a5\u09be\u0995\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7, \u09a4\u09be\u0987 \u09b8\u09be\u0981\u09a4\u09be\u09b0 \u09a8\u09be \u099c\u09be\u09a8\u09b2\u09c7 \u09aa\u09be\u09a8\u09bf\u09a4\u09c7 \u09a8\u09be\u09ae\u09ac\u09c7\u09a8 \u09a8\u09be\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u0994\u09b7\u09a7 \u0993 \u09b8\u09b0\u099e\u09cd\u099c\u09be\u09ae&lt;\/strong&gt;: \u09aa\u09cd\u09b0\u09df\u09cb\u099c\u09a8\u09c0\u09df \u0994\u09b7\u09a7, \u0993\u09a1\u09cb\u09ae\u09b8 \u0995\u09cd\u09b0\u09bf\u09ae \u098f\u09ac\u0982 \u099f\u09cd\u09b0\u09c7\u0995\u09bf\u0982\u09df\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u09ad\u09be\u09b2\u09cb \u0997\u09cd\u09b0\u09bf\u09aa\u09c7\u09b0 \u099c\u09c1\u09a4\u09cb \u09b8\u09be\u09a5\u09c7 \u09b0\u09be\u0996\u09c1\u09a8\u09 /images\/boga-lake-1777271326-zfA1s-1778172069.webp&quot;}]},{&quot;id&quot;:155,&quot;category_id&quot;:7,&quot;name&quot;:&quot;Khoa Sagar Dighi&quot;,&quot;bn_name&quot;:&quot;\u0996\u09cb\u09af\u09bc\u09be \u09b8\u09be\u0997\u09b0 \u09a6\u09c0\u0998\u09bf&quot;,&quot;slug&quot;:&quot;khoa-sagar-dighi&quot;,&quot;description&quot;:&quot;&lt;p&gt;\u09b2\u0995\u09cd\u09b7\u09cd\u09ae\u09c0\u09aa\u09c1\u09b0 \u099c\u09c7\u09b2\u09be\u09b0 \u09a6\u09be\u09b2\u09be\u09b2 \u09ac\u09be\u099c\u09be\u09b0 \u098f\u09b2\u09be\u0995\u09be\u09df \u099c\u09ae\u09bf\u09a6\u09be\u09b0 \u09ac\u09be\u09dc\u09bf\u09b0 \u09a0\u09bf\u0995 \u09b8\u09be\u09ae\u09a8\u09c7\u0987 \u0985\u09ac\u09b8\u09cd\u09a5\u09bf\u09a4 &lt;strong&gt;\u0996\u09cb\u09af\u09bc\u09be \u09b8\u09be\u0997\u09b0 \u09a6\u09c0\u0998\u09bf&lt;\/strong&gt; (Khoa Sagor Dighi) \u098f\u0987 \u0985\u099e\u09cd\u099a\u09b2\u09c7\u09b0 \u0985\u09a8\u09cd\u09af\u09a4\u09ae \u09aa\u09cd\u09b0\u09be\u099a\u09c0\u09a8 \u098f\u09ac\u0982 \u09ac\u09bf\u09b6\u09be\u09b2\u09be\u0995\u09be\u09b0 \u098f\u0995\u099f\u09bf \u099c\u09b2\u09be\u09b6\u09df\u0964 \u09aa\u09cd\u09b0\u09be\u09df \u09e8\u09eb \u098f\u0995\u09b0 \u099c\u09be\u09df\u0997\u09be \u099c\u09c1\u09dc\u09c7 \u09ac\u09bf\u09b8\u09cd\u09a4\u09c3\u09a4 \u098f\u0987 \u09a6\u09c0\u0998\u09bf\u099f\u09bf \u09a4\u09be\u09b0 \u09ac\u09bf\u09b6\u09be\u09b2\u09a4\u09be \u098f\u09ac\u0982 \u098f\u09b0 \u09b8\u09be\u09a5\u09c7 \u099c\u09dc\u09bf\u09df\u09c7 \u09a5\u09be\u0995\u09be \u09b2\u09cb\u0995\u0995\u09a5\u09be\u09b0 \u099c\u09a8\u09cd\u09af \u09aa\u09b0\u09cd\u09af\u099f\u0995\u09a6\u09c7\u09b0 \u0995\u09be\u099b\u09c7 \u0985\u09a4\u09cd\u09af\u09a8\u09cd\u09a4 \u099c\u09a8\u09aa\u09cd\u09b0\u09bf\u09df\u0964&lt;\/p&gt;&lt;hr&gt;&lt;h3&gt;\ud83c\udf0a \u09aa\u09cd\u09b0\u09a7\u09be\u09a8 \u0986\u0995\u09b0\u09cd\u09b7\u09a3&lt;\/h3&gt;&lt;p&gt;\u0996\u09cb\u09df\u09be \u09b8\u09be\u0997\u09b0 \u09a6\u09c0\u0998\u09bf\u09b0 \u09ac\u09bf\u09b6\u09be\u09b2 \u099c\u09b2\u09b0\u09be\u09b6\u09bf \u098f\u09ac\u0982 \u098f\u09b0 \u09b6\u09be\u09a8\u09cd\u09a4 \u09aa\u09b0\u09bf\u09ac\u09c7\u09b6 \u0986\u09aa\u09a8\u09be\u0995\u09c7 \u09ae\u09c1\u0997\u09cd\u09a7 \u0995\u09b0\u09ac\u09c7:&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09ac\u09bf\u09b6\u09be\u09b2\u09a4\u09be:&lt;\/strong&gt; \u098f\u0987 \u09a6\u09c0\u0998\u09bf\u099f\u09bf \u098f\u09a4\u0987 \u09ac\u09dc \u09af\u09c7 \u098f\u0995 \u09aa\u09be\u09dc\u09c7 \u09a6\u09be\u0981\u09dc\u09bf\u09df\u09c7 \u0985\u09a8\u09cd\u09af \u09aa\u09be\u09dc\u09c7\u09b0 \u09ae\u09be\u09a8\u09c1\u09b7\u0995\u09c7 \u099a\u09c7\u09a8\u09be \u0995\u09a0\u09bf\u09a8\u0964 \u098f\u09b0 \u09ac\u09bf\u09b6\u09be\u09b2\u09a4\u09be\u09b0 \u0995\u09be\u09b0\u09a3\u09c7\u0987 \u09b8\u09cd\u09a5\u09be\u09a8\u09c0\u09df\u09b0\u09be \u098f\u0995\u09c7 &amp;#039;\u09b8\u09be\u0997\u09b0&amp;#039; \u09ac\u09b2\u09c7 \u09a1\u09be\u0995\u09c7\u09a8\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09a8\u09be\u09ae\u0995\u09b0\u09a3\u09c7\u09b0 \u0987\u09a4\u09bf\u09b9\u09be\u09b8:&lt;\/strong&gt; \u099c\u09a8\u09b6\u09cd\u09b0\u09c1\u09a4\u09bf \u0986\u099b\u09c7 \u09af\u09c7, \u098f\u0987 \u09a6\u09c0\u0998\u09bf\u09b0 \u09aa\u09be\u09a8\u09bf \u098f\u09a4\u0987 \u09b8\u09cd\u09ac\u099a\u09cd\u099b \u0993 \u09a8\u09bf\u09b0\u09cd\u09ae\u09b2 \u099b\u09bf\u09b2 \u09af\u09c7 \u0995\u09c1\u09df\u09be\u09b6\u09be\u099a\u09cd\u099b\u09a8\u09cd\u09a8 \u09a6\u09bf\u09a8\u09c7 \u098f\u09b0 \u099c\u09b2\u09b0\u09be\u09b6\u09bf \u0995\u09c1\u09df\u09be\u09b6\u09be \u09ac\u09be &amp;#039;\u0996\u09cb\u09df\u09be&amp;#039;\u09b0 \u09ae\u09a4\u09cb \u09b8\u09be\u09a6\u09be \u09a6\u09c7\u0996\u09be\u09a4\u0964 \u09b8\u09c7\u0996\u09be\u09a8 \u09a5\u09c7\u0995\u09c7\u0987 \u098f\u09b0 \u09a8\u09be\u09ae \u09b9\u09df\u09c7\u099b\u09c7 &amp;#039;\u0996\u09cb\u09df\u09be \u09b8\u09be\u0997\u09b0&amp;#039;\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u099c\u09ae\u09bf\u09a6\u09be\u09b0 \u09ac\u09be\u09dc\u09bf\u09b0 \u09b8\u09be\u09a8\u09cd\u09a8\u09bf\u09a7\u09cd\u09af:&lt;\/strong&gt; \u09a6\u09c0\u0998\u09bf\u09b0 \u098f\u0995\u09a6\u09ae \u09aa\u09be\u09b6\u09c7\u0987 \u09ac\u09bf\u0996\u09cd\u09af\u09be\u09a4 &lt;strong&gt;\u09a6\u09be\u09b2\u09be\u09b2 \u09ac\u09be\u099c\u09be\u09b0 \u099c\u09ae\u09bf\u09a6\u09be\u09b0 \u09ac\u09be\u09dc\u09bf&lt;\/strong&gt; \u0985\u09ac\u09b8\u09cd\u09a5\u09bf\u09a4\u0964 \u09b0\u09be\u099c\u09ac\u09be\u09dc\u09bf\u09b0 \u09a7\u09cd\u09ac\u0982\u09b8\u09be\u09ac\u09b6\u09c7\u09b7 \u09a6\u09c7\u0996\u09be\u09b0 \u09aa\u09b0 \u09a6\u09c0\u0998\u09bf\u09b0 \u09aa\u09be\u09dc\u09c7 \u09ac\u09b8\u09c7 \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4\u09bf \u09a6\u09c2\u09b0 \u0995\u09b0\u09be \u09aa\u09b0\u09cd\u09af\u099f\u0995\u09a6\u09c7\u09b0 \u09aa\u09cd\u09b0\u09a7\u09be\u09a8 \u0986\u0995\u09b0\u09cd\u09b7\u09a3\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09ac\u09bf\u0995\u09c7\u09b2\u09c7\u09b0 \u09aa\u09b0\u09bf\u09ac\u09c7\u09b6:&lt;\/strong&gt; \u09a6\u09c0\u0998\u09bf\u09b0 \u09aa\u09be\u09dc\u09c7 \u09b8\u09be\u09b0\u09bf\u09ac\u09a6\u09cd\u09a7 \u0997\u09be\u099b\u09aa\u09be\u09b2\u09be \u098f\u09ac\u0982 \u09a0\u09be\u09a8\u09cd\u09a1\u09be \u09ac\u09be\u09a4\u09be\u09b8 \u09ac\u09bf\u0995\u09c7\u09b2\u09c7\u09b0 \u0986\u09a1\u09cd\u09a1\u09be\u09b0 \u099c\u09a8\u09cd\u09af \u099a\u09ae\u09ce\u0995\u09be\u09b0 \u098f\u0995 \u09aa\u09b0\u09bf\u09ac\u09c7\u09b6 \u09a4\u09c8\u09b0\u09bf \u0995\u09b0\u09c7\u0964 \u098f\u0996\u09be\u09a8 \u09a5\u09c7\u0995\u09c7 \u09b8\u09c2\u09b0\u09cd\u09af\u09be\u09b8\u09cd\u09a4\u09c7\u09b0 \u09a6\u09c3\u09b6\u09cd\u09af\u0993 \u0996\u09c1\u09ac \u09b8\u09c1\u09a8\u09cd\u09a6\u09b0 \u09a6\u09c7\u0996\u09be\u09af\u09bc\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09b6\u09c0\u09a4\u0995\u09be\u09b2\u09c0\u09a8 \u0985\u09a4\u09bf\u09a5\u09bf \u09aa\u09be\u0996\u09bf:&lt;\/strong&gt; \u09b6\u09c0\u09a4\u0995\u09be\u09b2\u09c7 \u098f\u0987 \u09a6\u09c0\u0998\u09bf\u09a4\u09c7 \u09ae\u09be\u099d\u09c7\u09ae\u09a7\u09cd\u09af\u09c7 \u0985\u09a4\u09bf\u09a5\u09bf \u09aa\u09be\u0996\u09bf\u09b0 \u0986\u09a8\u09be\u0997\u09cb\u09a8\u09be \u09a6\u09c7\u0996\u09be \u09af\u09be\u09df, \u09af\u09be \u098f\u09b0 \u09b8\u09cc\u09a8\u09cd\u09a6\u09b0\u09cd\u09af \u0986\u09b0\u0993 \u09ac\u09be\u09dc\u09bf\u09df\u09c7 \u09a6\u09c7\u09df\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;hr&gt;&lt;h3&gt;\u23f0 \u09ad\u09cd\u09b0\u09ae\u09a3\u09c7\u09b0 \u09b8\u09c7\u09b0\u09be \u09b8\u09ae\u09af\u09bc&lt;\/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09ac\u09bf\u0995\u09c7\u09b2\u09c7\u09b0 \u09b8\u09ae\u09df:&lt;\/strong&gt; \u0996\u09cb\u09df\u09be \u09b8\u09be\u0997\u09b0 \u09a6\u09c0\u0998\u09bf \u0989\u09aa\u09ad\u09cb\u0997 \u0995\u09b0\u09be\u09b0 \u09b8\u09c7\u09b0\u09be \u09b8\u09ae\u09df \u09b9\u09b2\u09cb \u09ac\u09bf\u0995\u09c7\u09b2 \u09ea\u099f\u09be\u09b0 \u09aa\u09b0 \u09a5\u09c7\u0995\u09c7 \u09b8\u09c2\u09b0\u09cd\u09af\u09be\u09b8\u09cd\u09a4 \u09aa\u09b0\u09cd\u09af\u09a8\u09cd\u09a4\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09b6\u09c0\u09a4\u0995\u09be\u09b2 (\u09a8\u09ad\u09c7\u09ae\u09cd\u09ac\u09b0 \u2013 \u09ab\u09c7\u09ac\u09cd\u09b0\u09c1\u09df\u09be\u09b0\u09bf):&lt;\/strong&gt; \u0986\u09ac\u09b9\u09be\u0993\u09df\u09be \u09ae\u09a8\u09cb\u09b0\u09ae \u09a5\u09be\u0995\u09be\u09df \u098f\u09ac\u0982 \u09b0\u09cb\u09a6\u09c7\u09b0 \u09a4\u09c0\u09ac\u09cd\u09b0\u09a4\u09be \u0995\u09ae \u09a5\u09be\u0995\u09be\u09df \u09a6\u09c0\u0998\u09bf\u09b0 \u09aa\u09be\u09dc\u09c7 \u09ac\u09b8\u09c7 \u09a5\u09be\u0995\u09be \u09ac\u09be \u0998\u09c1\u09b0\u09c7 \u09a6\u09c7\u0996\u09be \u0986\u09b0\u09be\u09ae\u09a6\u09be\u09df\u0995 \u09b9\u09df\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;hr&gt;&lt;h3&gt;\ud83d\udcb0 \u0996\u09b0\u099a \u0993 \u099f\u09bf\u0995\u09bf\u099f&lt;\/h3&gt;&lt;p&gt;\u0996\u09cb\u09df\u09be \u09b8\u09be\u0997\u09b0 \u09a6\u09c0\u0998\u09bf \u09aa\u09b0\u09bf\u09a6\u09b0\u09cd\u09b6\u09a8\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u0995\u09cb\u09a8\u09cb \u099f\u09bf\u0995\u09c7\u099f \u09ac\u09be \u09aa\u09cd\u09b0\u09ac\u09c7\u09b6 \u09ab\u09bf \u09b2\u09be\u0997\u09c7 \u09a8\u09be\u0964 \u098f\u099f\u09bf \u099c\u09a8\u09b8\u09be\u09a7\u09be\u09b0\u09a3\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u09b8\u09ae\u09cd\u09aa\u09c2\u09b0\u09cd\u09a3 \u0989\u09a8\u09cd\u09ae\u09c1\u0995\u09cd\u09a4 \u098f\u0995\u099f\u09bf \u09b8\u09cd\u09a5\u09be\u09a8\u0964&lt;\/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;strong&gt;\u09af\u09be\u09a4\u09be\u09df\u09be\u09a4:&lt;\/strong&gt; \u09b2\u0995\u09cd\u09b7\u09cd\u09ae\u09c0\u09aa\u09c1\u09b0 \u09b6\u09b9\u09b0 \u09a5\u09c7\u0995\u09c7 \u09b8\u09bf\u098f\u09a8\u099c\u09bf \u09ac\u09be \u0985\u099f\u09cb \u09ad\u09be\u09dc\u09be \u0996\u09c1\u09ac\u0987 \u09b8\u09be\u09ae\u09be\u09a8\u09cd\u09af\u0964&lt;\/p&gt;&lt;\/li&gt;&lt;\/ul&gt;&lt;hr&gt;&lt;h3&gt;\ud83d\udccd \u09af\u09be\u09a4\u09be\u09af\u09bc\u09be\u09a4 \u09ac\u09cd\u09af\u09ac\u09b8\u09cd\u09a5\u09be&lt;\/h3&gt;&lt;p&gt;\u098f\u099f\u09bf \u09b2\u0995\u09cd\u09b7\u09cd\u09ae\u09c0\u09aa\u09c1\u09b0 \u099c\u09c7\u09b2\u09be \u09b6\u09b9\u09b0 \u09a5\u09c7\u0995\u09c7 \u09aa\u09cd\u09b0\u09be\u09df \u09eb \u0995\u09bf\u09b2\u09cb\u09ae\u09bf\u099f\u09be\u09b0 \u09aa\u09b6\u09cd\u099a\u09bf\u09ae\u09c7 \u09a6\u09be\u09b2\u09be\u09b2 \u09ac\u09be\u099c\u09be\u09b0 \u09a8\u09be\u09ae\u0995 \u09b8\u09cd\u09a5\u09be\u09a8\u09c7 \u0985\u09ac\u09b8\u09cd\u09a5\u09bf\u09a4\u0964&lt;\/p&gt;&lt;p&gt;\u09e7. &lt;strong&gt;\u09b2\u0995\u09cd\u09b7\u09cd\u09ae\u09c0\u09aa\u09c1\u09b0 \u09b6\u09b9\u09b0 \u09a5\u09c7\u0995\u09c7:&lt;\/strong&gt; \u09b2\u0995\u09cd\u09b7\u09cd\u09ae\u09c0\u09aa\u09c1\u09b0 \u099c\u09bf\u09b0\u09cb \u09aa\u09df\u09c7\u09a8\u09cd\u099f \u09ac\u09be \u09ac\u09be\u09b8 \u09b8\u09cd\u099f\u09cd\u09af\u09be\u09a8\u09cd\u09a1 \u09a5\u09c7\u0995\u09c7 \u09b0\u09be\u09df\u09aa\u09c1\u09b0\u0997\u09be\u09ae\u09c0 \u09b
